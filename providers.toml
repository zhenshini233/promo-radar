# watchlist：推理服务商官网监控清单
# 用 `radar add-provider <名称> --url <地址>` 追加，或直接编辑本文件。
# enabled=false 的服务商不抓取（notes 里说明原因）。
# aicredits 域名自动收编的新条目会追加在文件末尾（notes 标注来源）。

# ---------- 已验证事件的一号梯队 ----------

[[provider]]

name = "DeepInfra"
urls = [
    { label = "home", url = "https://deepinfra.com" },
    { label = "deepstart", url = "https://deepinfra.com/deepstart" },
]
notes = "Next.js SSR，promo 文案在静态 HTML（如 DeepStart $1,000 credits），可 grep"

[[provider]]

name = "Chutes"
urls = [
    { label = "home", url = "https://chutes.ai" },
    { label = "pricing", url = "https://chutes.ai/pricing" },
]
notes = "SSR，free tier 声明在静态 HTML"

[[provider]]

name = "Novita"
urls = [
    { label = "pricing", url = "https://novita.ai/pricing" },
]
notes = "Next.js；首页 promo 信号弱，盯 /pricing"

[[provider]]

name = "River"
urls = [
    { label = "home", url = "https://river.ai" },
]
notes = "xAI 联合创始人创办；曾送 $25（见 aicredits），官网 promo 出现/消失都是事件"

[[provider]]

name = "Hyperbolic"
urls = [
    { label = "home", url = "https://hyperbolic.ai" },
]
notes = "SSR，当前无静态 promo 文案，纳入监控等其上线"

[[provider]]

name = "Systalyze"
enabled = false
urls = [
    { label = "home", url = "https://www.systalyze.com" },
]
notes = "Framer 建 JS 渲染，脚本抓不到正文 → 每月人工看一次 console.systalyze.com"

