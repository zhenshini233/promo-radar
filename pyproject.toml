[project]
name = "promo-radar"
version = "0.1.0"
description = "Aggregate AI API credit promotions from directories, forums and provider sites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "jinja2>=3.1",
    "trafilatura>=1.12",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
