name: radar

on:
  schedule:
    # 每天一次（02:37 UTC，避开整点）；本地 serve 模式可随时手动/细分刷新
    - cron: "37 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run radar
        env:
          RADAR_TG_TOKEN: ${{ secrets.RADAR_TG_TOKEN }}
          RADAR_TG_CHAT_ID: ${{ secrets.RADAR_TG_CHAT_ID }}
        run: python -m radar run

      # 数据 commit 回仓库 = 持久化 + 去重历史 + 天然保活（规避 60 天无活动自动禁用）
      # providers.toml 一并提交：自动收编的新域名跨次运行持久
      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/ providers.toml
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "radar: update data [skip ci]"
            git push
          fi

      # dashboard 发布到 gh-pages 分支：仓库 Settings → Pages 选 gh-pages 即可在线访问
      # 公开仓库免费；私有仓库免费版无 Pages，可改用 Cloudflare Pages 连本仓库
      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "radar: publish dashboard [skip ci]"
