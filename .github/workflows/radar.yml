name: radar

on:
  schedule:
    # 每天一次（02:37 UTC，避开整点）；本地 serve 模式可随时手动/细分刷新
    - cron: "37 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      # 数据库二进制不再提交主分支：从独立 data 分支持久化（见文末 Persist）
      - name: Restore database
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show origin/data:radar.db > data/radar.db
            echo "restored data/radar.db from data branch"
          else
            echo "no data branch yet; starting fresh"
          fi

      - name: Run radar
        env:
          RADAR_TG_TOKEN: ${{ secrets.RADAR_TG_TOKEN }}
          RADAR_TG_CHAT_ID: ${{ secrets.RADAR_TG_CHAT_ID }}
          RADAR_AA_KEY: ${{ secrets.RADAR_AA_KEY }}
        run: python -m radar run

      # 实体层脚本：宇宙 → 标注 → Provider → 历史 Offer 迁移，然后重建站点。
      # build_offers.py 只在该库还没有 AI Offer 时执行（幂等），
      # 之后 AI 与云都由 radar run 直接写入 offers。
      - name: Rebuild entities
        run: |
          python scripts/universe_report.py
          python scripts/annotate_universe.py
          python scripts/import_providers.py
          python scripts/build_offers.py
          python -m radar report

      # providers.toml 是文本、体积小、需要 review，保留在主分支提交；
      # 站点产物与 333 个 monitor json 不再进 git（体积与噪音都不可接受）。
      - name: Commit providers.toml
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add providers.toml
          if git diff --cached --quiet; then
            echo "no provider changes"
          else
            git commit -m "radar: update providers [skip ci]"
            git push
          fi

      # SQLite 数据库走独立 data 分支（orphan + force push，只保留最新快照），
      # 主分支因此不会每天膨胀；需要历史时从 data 分支或本地备份取。
      - name: Persist database to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import sqlite3; c=sqlite3.connect('data/radar.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          TMP=$(mktemp -d)
          cp data/radar.db "$TMP/radar.db"
          cd "$TMP"
          git init -q
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b data
          git add radar.db
          git commit -q -m "radar: db snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # dashboard 发布到 gh-pages：直接发布工作区产物，不产生主分支提交
      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "radar: publish dashboard [skip ci]"